<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#38291f">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="robots" content="noindex">
<title>訂單查詢｜鍋淬 GUOCUI</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&family=Noto+Serif+TC:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--brown:#38291f;--orange:#b76b38;--cream:#faf6ef;--line:#e8dfd3}
body{font-family:'Noto Sans TC',sans-serif;background:var(--cream);color:var(--brown)}
h1,h2,h3,.serif{font-family:'Noto Serif TC',serif}
button,a,input{outline-offset:3px}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}
.container-wide{max-width:1240px;margin:auto;padding-left:24px;padding-right:24px}
.btn-primary{background:var(--brown);color:#fff;padding:13px 22px;border-radius:4px;transition:.2s}.btn-primary:hover{background:#65452e}
.btn-outline{border:1px solid currentColor;padding:12px 21px;border-radius:4px}
.section-kicker{color:var(--orange);letter-spacing:.2em;font-size:12px;font-weight:700}
.field{border:1px solid #d8cbbd;border-radius:4px;background:#fff;padding:11px 12px;width:100%;min-width:0}.field:focus{outline:2px solid #b76b38;outline-offset:1px}
.toast{transform:translateY(20px);opacity:0;transition:.25s;pointer-events:none}.toast.show{transform:translateY(0);opacity:1}
/* 狀態進度條 */
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:0;list-style:none;padding:0;margin:0}
.step{position:relative;text-align:center;font-size:13px;color:#84766a;padding-top:30px}
.step::before{content:"";position:absolute;top:8px;left:0;right:0;height:3px;background:#e8dfd3}
.step:first-child::before{left:50%}.step:last-child::before{right:50%}
.step::after{content:"";position:absolute;top:0;left:50%;width:19px;height:19px;margin-left:-9.5px;border-radius:50%;background:#fff;border:3px solid #d8cbbd;box-sizing:border-box;z-index:1}
.step.done{color:var(--brown)}.step.done::before{background:var(--orange)}
.step.done::after{background:var(--orange);border-color:var(--orange)}
.step.current{font-weight:700;color:var(--brown)}
.step.current::before{background:linear-gradient(90deg,var(--orange) 50%,#e8dfd3 50%)}
.step.current:first-child::before{background:#e8dfd3}
.step.current::after{background:#fff;border-color:var(--orange);box-shadow:0 0 0 4px #b76b3833}
.step:last-child.current::before,.step:last-child.done::before{background:var(--orange)}
.step.done:last-child::after,.step.current:last-child::after{background:var(--orange);border-color:var(--orange)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<header class="sticky top-0 z-40 bg-[#faf6ef]/95 backdrop-blur border-b border-[#e8dfd3]">
 <div class="container-wide h-[76px] flex items-center justify-between gap-4">
  <a href="index.html" class="flex items-center gap-3 shrink-0" aria-label="鍋淬首頁"><span class="w-10 h-10 rounded-full bg-[#38291f] text-white flex items-center justify-center serif text-xl">淬</span><span class="leading-tight"><strong class="block serif text-xl tracking-[.2em]">鍋淬</strong><small class="text-[10px] tracking-[.32em]">GUOCUI</small></span></a>
  <nav class="flex items-center gap-4 sm:gap-6 text-sm" aria-label="主要導覽"><a class="hover:text-[#b76b38]" href="index.html#menu">線上點餐</a><a class="hover:text-[#b76b38] font-semibold" href="orders.html" aria-current="page">訂單查詢</a><a class="btn-primary text-sm hidden sm:inline-block" href="index.html">回首頁</a></nav>
 </div>
</header>

<main class="container-wide py-12 md:py-16">
 <div class="max-w-xl mx-auto">
  <p class="section-kicker mb-2">ORDER STATUS</p>
  <h1 class="text-3xl md:text-4xl mb-3">訂單查詢</h1>
  <p class="text-sm leading-7 text-[#746457] mb-8">請輸入下單時的電話與訂單編號，即可查看餐點的製作進度。</p>

  <form id="lookupForm" class="bg-white border border-[#e8dfd3] rounded-md p-5 md:p-6 space-y-4" novalidate>
   <div><label for="qPhone" class="block text-sm mb-1">聯絡電話</label><input id="qPhone" class="field" type="tel" inputmode="tel" autocomplete="tel" maxlength="20" placeholder="下單時填寫的電話" required></div>
   <div><label for="qOrderId" class="block text-sm mb-1">訂單編號</label><input id="qOrderId" class="field" type="text" autocapitalize="characters" autocomplete="off" maxlength="30" placeholder="例如 GC20261118-0001" required></div>
   <button id="lookupBtn" class="btn-primary w-full" type="submit">查詢訂單</button>
  </form>

  <p id="errorBox" class="hidden mt-5 text-sm leading-7 bg-[#fdf1ec] border border-[#efc7b6] text-[#8a3b1e] rounded p-4" role="alert"></p>

  <section id="result" class="hidden mt-6 bg-white border border-[#e8dfd3] rounded-md p-5 md:p-6" aria-live="polite" aria-labelledby="resultTitle">
   <div class="flex items-start justify-between gap-4">
    <div><p class="text-xs text-[#84766a]">訂單編號</p><h2 id="resultTitle" class="text-xl break-all"></h2></div>
    <span id="statusBadge" class="shrink-0 text-sm font-semibold px-3 py-1 rounded-full"></span>
   </div>
   <div id="stepsWrap" class="mt-6"><ol id="steps" class="steps" aria-label="訂單進度"></ol></div>
   <p id="statusHint" class="mt-5 text-sm leading-7 text-[#746457]"></p>

   <h3 class="text-base mt-7 mb-3">訂購品項</h3>
   <ul id="items" class="divide-y divide-[#e8dfd3] border-y border-[#e8dfd3] text-sm"></ul>
   <div class="flex justify-between items-center font-semibold text-lg pt-4"><span>訂單金額</span><span id="total"></span></div>

   <div class="mt-6 pt-5 border-t border-[#e8dfd3] flex flex-col sm:flex-row sm:items-center justify-between gap-4">
    <p class="text-sm text-[#746457]">更新時間：<time id="updatedAt" class="font-semibold text-[#38291f]"></time></p>
    <button id="refreshBtn" class="btn-outline text-sm" type="button">重新查詢</button>
   </div>
  </section>

  <p class="text-xs text-[#84766a] mt-8 leading-6">狀態由門市人員更新，若超過預期時間仍沒有變化，歡迎直接聯絡門市。<br><a class="underline" href="index.html">← 返回首頁</a></p>
 </div>
</main>

<div id="toast" role="status" aria-live="polite" class="toast fixed bottom-6 left-1/2 -translate-x-1/2 z-[90] bg-[#38291f] text-white px-6 py-3 rounded shadow-lg text-sm text-center max-w-[90vw]"></div>

<script>
const ORDER_ENDPOINT='https://script.google.com/macros/s/AKfycbw3JZQ0Rd-xwBHGHFP1TQ1j5A53TihVcuDEQpHmrZcrKEKClz9nSV8FI5nJ1HThJwmBTA/exec';
const STORE_KEY='guocui-last-order';
const FLOW=['已收到','製作中','可取餐','已完成'];
const BADGE={'已收到':'bg-[#f1e7d8] text-[#65452e]','製作中':'bg-[#fbe3cf] text-[#9d562c]','可取餐':'bg-[#dcefd9] text-[#2f6b35]','已完成':'bg-[#38291f] text-white','已取消':'bg-[#eee] text-[#666]'};
const HINT={'已收到':'門市已收到您的訂單，準備開始製作。','製作中':'餐點正在現做中，請稍候。','可取餐':'餐點已完成，歡迎前來取餐！','已完成':'這筆訂單已完成，感謝您的訂購。','已取消':'這筆訂單已取消，如有疑問請聯絡門市。'};
const $=s=>document.querySelector(s),money=n=>`NT$ ${Number(n).toLocaleString('zh-TW')}`;
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let toastTimer,busy=false,current=null;

function toast(m){const el=$('#toast');el.textContent=m;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2600)}
function showError(m){const b=$('#errorBox');b.textContent=m;b.classList.toggle('hidden',!m)}

function render(d){
 current={orderId:d.orderId};
 $('#resultTitle').textContent=d.orderId;
 const badge=$('#statusBadge');badge.textContent=d.status;badge.className='shrink-0 text-sm font-semibold px-3 py-1 rounded-full '+(BADGE[d.status]||BADGE['已收到']);
 const idx=FLOW.indexOf(d.status),cancelled=d.status==='已取消';
 $('#stepsWrap').classList.toggle('hidden',cancelled);
 $('#steps').innerHTML=FLOW.map((n,i)=>`<li class="step ${idx>i?'done':''} ${idx===i?'current':''}" ${idx===i?'aria-current="step"':''}>${n}</li>`).join('');
 $('#statusHint').textContent=HINT[d.status]||'';
 $('#items').innerHTML=(d.items||[]).map(it=>`<li class="flex justify-between gap-4 py-3"><span>${esc(it.name)} <span class="text-[#84766a]">× ${esc(it.qty)}</span></span><span class="shrink-0">${money(it.subtotal)}</span></li>`).join('')||'<li class="py-3 text-[#84766a]">無品項資料</li>';
 $('#total').textContent=money(d.total);
 $('#updatedAt').textContent=d.updatedAt||'—';
 $('#result').classList.remove('hidden');
}

async function lookup(manual){
 if(busy)return;
 const phone=$('#qPhone').value.trim(),orderId=$('#qOrderId').value.trim().toUpperCase();
 showError('');
 if(!ORDER_ENDPOINT){showError('目前為展示模式，尚未連接訂單系統。');return}
 if(phone.replace(/\D/g,'').length<8||!orderId){showError('請輸入正確的電話與訂單編號。');return}
 busy=true;
 const btns=[$('#lookupBtn'),$('#refreshBtn')],labels=btns.map(b=>b.textContent);
 btns.forEach(b=>{b.disabled=true});(manual==='refresh'?$('#refreshBtn'):$('#lookupBtn')).innerHTML='<span class="spin"></span>查詢中…';
 try{
  const url=`${ORDER_ENDPOINT}?action=lookup&orderId=${encodeURIComponent(orderId)}&phone=${encodeURIComponent(phone)}&_=${Date.now()}`;
  const res=await fetch(url,{cache:'no-store'});
  const d=await res.json();
  if(!d.ok){$('#result').classList.add('hidden');showError(d.error||'查詢失敗，請稍後再試。');return}
  const prev=current&&current.orderId===d.orderId?$('#statusBadge').textContent:null;
  render(d);
  try{localStorage.setItem(STORE_KEY,JSON.stringify({orderId:d.orderId,phone}))}catch(_){}
  if(manual==='refresh')toast(prev&&prev!==d.status?`狀態已更新：${d.status}`:'已是最新狀態');
 }catch(err){
  showError('網路連線異常，無法取得最新狀態，請稍後再試。');
 }finally{
  busy=false;btns.forEach((b,i)=>{b.disabled=false;b.textContent=labels[i]});
 }
}

$('#lookupForm').addEventListener('submit',e=>{e.preventDefault();lookup('form')});
$('#refreshBtn').addEventListener('click',()=>lookup('refresh'));

// 自動帶入上次送單的資料並查詢
(function init(){
 let saved=null;try{saved=JSON.parse(localStorage.getItem(STORE_KEY)||'null')}catch(_){}
 if(saved){$('#qPhone').value=saved.phone||'';$('#qOrderId').value=saved.orderId||''}
 if($('#qPhone').value&&$('#qOrderId').value&&ORDER_ENDPOINT)lookup('form');
})();

if('serviceWorker' in navigator&&location.protocol!=='file:')window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
</html>
